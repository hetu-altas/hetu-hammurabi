<?xml version="1.0" encoding="UTF-8"?>
<!-- hetu_logo_07.svg 水墨候选2：远山黛青（山水入画）——立轴挂轴 + 三层远山 + K 线山前走势 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="河图">
  <defs>
    <!-- 滚筒圆柱渐变：重→淡（木色感，双 stop） -->
    <linearGradient id="grad-roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57504A"/>
      <stop offset="100%" stop-color="#8D8578"/>
    </linearGradient>
  </defs>

  <!-- 淡赭纸画布底 -->
  <rect id="bg-paper" x="0" y="0" width="500" height="500" fill="#F3E9D6"/>

  <!-- 滚筒：天杆 / 地杆（T=18，T/W=10.0%）+ 重墨轴头（无金） -->
  <g id="scroll-roll">
    <rect id="rod-top" x="148" y="100" width="204" height="18" rx="4" fill="url(#grad-roll)"/>
    <rect id="rod-bottom" x="148" y="382" width="204" height="18" rx="4" fill="url(#grad-roll)"/>
    <circle id="cap-tl" cx="148" cy="109" r="11.5" fill="#57504A"/>
    <circle id="cap-tr" cx="352" cy="109" r="11.5" fill="#57504A"/>
    <circle id="cap-bl" cx="148" cy="391" r="11.5" fill="#57504A"/>
    <circle id="cap-br" cx="352" cy="391" r="11.5" fill="#57504A"/>
  </g>

  <!-- 竖向画幅（W=180，02 传承坐标） -->
  <g id="scroll-body">
    <rect id="panel" x="160" y="118" width="180" height="264" fill="#F3E9D6" stroke="#3B3733" stroke-width="2.5"/>
    <!-- 远山：三层山形层叠（清墨最远最淡 → 淡墨 → 黛青最近最实），K 线自山前升起 -->
    <path id="motif-mountain-1" d="M160,340 Q200,310 240,335 Q290,305 340,340 L340,382 L160,382 Z" fill="#B7AFA2" opacity="0.55"/>
    <path id="motif-mountain-2" d="M160,352 Q210,328 258,348 Q300,322 340,350 L340,382 L160,382 Z" fill="#8D8578" opacity="0.7"/>
    <path id="motif-mountain-3" d="M160,363 Q226,342 276,360 Q312,344 340,362 L340,382 L160,382 Z" fill="#4E5D66" opacity="0.85"/>
  </g>

