      <path id="kl-7-flying-2" d="M326.5,199.5 C 327.5,198 328.5,196.5 329.5,195" fill="none" stroke="#A96B5F" stroke-width="0.5" opacity="0.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 周期刻度：基线 + 7 根短线（02 坐标传承，淡墨弱化） -->
  <g id="quant-scale">
    <line id="baseline" x1="160" y1="366" x2="340" y2="366" stroke="#8D8578" stroke-width="1.5" opacity="0.35"/>
    <g stroke="#8D8578" stroke-width="1.5" opacity="0.45">
      <line id="tick-1" x1="172" y1="352" x2="172" y2="362"/>
      <line id="tick-2" x1="196" y1="352" x2="196" y2="362"/>
      <line id="tick-3" x1="220" y1="352" x2="220" y2="362"/>
      <line id="tick-4" x1="244" y1="352" x2="244" y2="362"/>
      <line id="tick-5" x1="268" y1="352" x2="268" y2="362"/>
      <line id="tick-6" x1="292" y1="352" x2="292" y2="362"/>
      <line id="tick-7" x1="316" y1="352" x2="316" y2="362"/>
    </g>
  </g>

  <!-- 印章落款：淡朱砂方印（36×36，2 字意会块面 + 白文留白，无真实文字规避字体依赖）；置顶压刻度线，仿"印压线"传统 -->
  <g id="motif-seal">
    <rect id="motif-seal-body" x="300" y="336" width="36" height="36" rx="4" fill="#A96B5F"/>
    <rect id="seal-white-1" x="305" y="344" width="9" height="20" fill="#F3E9D6"/>
    <rect id="seal-white-2" x="322" y="344" width="9" height="20" fill="#F3E9D6"/>
  </g>

  <!-- 顶部绦带：挂环 + 挂绳（本组最粗 3.5）+ 双垂穗（置顶可见） -->
  <g id="scroll-ribbon">
    <circle id="ring" cx="250" cy="100" r="4.5" fill="none" stroke="#57504A" stroke-width="2.2"/>
    <path id="cord" d="M250,104 C244,116 256,122 250,128" fill="none" stroke="#57504A" stroke-width="3.5" stroke-linecap="round"/>
    <path id="tassel" d="M243,136 L257,136 L250,162 Z" fill="#57504A" opacity="0.9"/>
    <path id="tassel-2" d="M240,138 L254,138 L247,158 Z" fill="#57504A" opacity="0.6"/>
