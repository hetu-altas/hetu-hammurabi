    </g>
    <g id="kl-6">
      <path id="kl-6-up-1" d="M292,214 L292,209.8" fill="none" stroke="#4E5D66" stroke-width="2.4" stroke-linecap="round"/>
      <path id="kl-6-up-2" d="M292,209.8 L292,205" fill="none" stroke="#4E5D66" stroke-width="1.6" stroke-linecap="round"/>
