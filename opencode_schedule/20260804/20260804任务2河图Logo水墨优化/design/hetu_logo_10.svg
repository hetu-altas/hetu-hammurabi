      <path id="kl-5-down-1" d="M268,274 L268,278.2" fill="none" stroke="#A96B5F" stroke-width="2.4" stroke-linecap="round"/>
      <path id="kl-5-down-2" d="M268,278.2 L268,283" fill="none" stroke="#A96B5F" stroke-width="1.6" stroke-linecap="round"/>
      <path id="kl-5-down-3" d="M268,283 L268,286" fill="none" stroke="#A96B5F" stroke-width="1.0" stroke-linecap="round"/>
