      <path id="kl-3-down-3" d="M220,308 L220,311" fill="none" stroke="#A96B5F" stroke-width="1.0" stroke-linecap="round"/>
      <path id="kl-3-body" d="M213.75,264 Q214.35,281.5 218.5,299 L224.5,299 Q222.65,281.5 223.25,264 Z" fill="#A96B5F"/>
    </g>
