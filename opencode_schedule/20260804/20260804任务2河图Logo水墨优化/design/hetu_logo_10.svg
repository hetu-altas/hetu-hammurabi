  <g id="quant-kline">
    <g id="kl-1">
      <path id="kl-1-up-1" d="M172,289 L172,284.8" fill="none" stroke="#A96B5F" stroke-width="2.4" stroke-linecap="round"/>
      <path id="kl-1-up-2" d="M172,284.8 L172,280" fill="none" stroke="#A96B5F" stroke-width="1.6" stroke-linecap="round"/>
      <path id="kl-1-up-3" d="M172,280 L172,277" fill="none" stroke="#A96B5F" stroke-width="1.0" stroke-linecap="round"/>
