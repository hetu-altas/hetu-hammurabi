      <path id="kl-4-up-1" d="M244,239 L244,234.8" fill="none" stroke="#4E5D66" stroke-width="2.4" stroke-linecap="round"/>
      <path id="kl-4-up-2" d="M244,234.8 L244,230" fill="none" stroke="#4E5D66" stroke-width="1.6" stroke-linecap="round"/>
      <path id="kl-4-up-3" d="M244,230 L244,227" fill="none" stroke="#4E5D66" stroke-width="1.0" stroke-linecap="round"/>
