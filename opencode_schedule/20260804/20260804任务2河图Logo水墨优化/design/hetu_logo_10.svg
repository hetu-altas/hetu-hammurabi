<?xml version="1.0" encoding="UTF-8"?>
<!-- hetu_logo_10.svg 水墨候选5：印章落款 + 纸纹（卷面作品感最足）——立轴挂轴 + 淡朱砂方印 + 边缘折痕 + 斜笔飞白，滚筒本组最大 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="河图">
  <!-- 淡赭纸画布底 -->
  <rect id="bg-paper" x="0" y="0" width="500" height="500" fill="#F3E9D6"/>

  <!-- 滚筒：天杆 / 地杆（T=24，T/W=13.3%，本组最大；无渐变，焦墨主体 + 哑金高光线表达圆柱曲面）+ 哑金双端轴头 -->
  <g id="scroll-roll">
    <rect id="rod-top" x="146" y="94" width="208" height="24" rx="5" fill="#3B3733"/>
    <rect id="rod-bottom" x="146" y="382" width="208" height="24" rx="5" fill="#3B3733"/>
    <line id="hi-light-top" x1="154" y1="97" x2="346" y2="97" stroke="#A9976B" stroke-width="2.0" opacity="0.5"/>
    <line id="hi-light-bottom" x1="154" y1="385" x2="346" y2="385" stroke="#A9976B" stroke-width="2.0" opacity="0.5"/>
    <circle id="cap-tl" cx="146" cy="106" r="14.5" fill="#A9976B"/>
    <circle id="cap-tr" cx="354" cy="106" r="14.5" fill="#A9976B"/>
    <circle id="cap-bl" cx="146" cy="394" r="14.5" fill="#A9976B"/>
    <circle id="cap-br" cx="354" cy="394" r="14.5" fill="#A9976B"/>
  </g>

  <!-- 竖向画幅（W=180，02 传承坐标） -->
  <g id="scroll-body">
    <rect id="panel" x="160" y="118" width="180" height="264" fill="#F3E9D6" stroke="#3B3733" stroke-width="2.5"/>
    <!-- 纸纹：画幅左右缘各一条清墨折痕线（微弯，仿宣纸纤维折痕） -->
    <path id="motif-crease-1" d="M168,124 Q165,240 170,376" fill="none" stroke="#B7AFA2" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
    <path id="motif-crease-2" d="M332,124 Q335,240 330,376" fill="none" stroke="#B7AFA2" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
  </g>

