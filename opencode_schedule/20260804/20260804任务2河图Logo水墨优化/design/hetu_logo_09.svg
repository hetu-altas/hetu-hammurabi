    <path id="motif-cloud-1b" d="M170,164 a40,13 0 1,0 80,0 a40,13 0 1,0 -80,0 Z" fill="#B7AFA2" opacity="0.15"/>
    <path id="motif-cloud-1c" d="M250,164 a40,13 0 1,0 80,0 a40,13 0 1,0 -80,0 Z" fill="#B7AFA2" opacity="0.15"/>
