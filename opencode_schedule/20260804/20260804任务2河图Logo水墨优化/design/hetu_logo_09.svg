<?xml version="1.0" encoding="UTF-8"?>
<!-- hetu_logo_09.svg 水墨候选4：云雾留白（渐隐于雾，禅意最浓）——立轴挂轴 + 三团清墨云纹 + 上段 K 线隐入雾中 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="河图">
  <defs>
    <!-- 滚筒圆柱渐变：焦→重→淡（墨感浓重，三 stop） -->
    <linearGradient id="grad-roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B3733"/>
      <stop offset="50%" stop-color="#57504A"/>
      <stop offset="100%" stop-color="#8D8578"/>
    </linearGradient>
  </defs>

  <!-- 淡赭纸画布底 -->
  <rect id="bg-paper" x="0" y="0" width="500" height="500" fill="#F3E9D6"/>

  <!-- 滚筒：天杆 / 地杆（T=20，T/W=11.1%）+ 哑金双轴头 -->
  <g id="scroll-roll">
    <rect id="rod-top" x="148" y="98" width="204" height="20" rx="4" fill="url(#grad-roll)"/>
    <rect id="rod-bottom" x="148" y="382" width="204" height="20" rx="4" fill="url(#grad-roll)"/>
    <circle id="cap-tl" cx="148" cy="108" r="12.5" fill="#A9976B"/>
    <circle id="cap-tr" cx="352" cy="108" r="12.5" fill="#A9976B"/>
    <circle id="cap-bl" cx="148" cy="392" r="12.5" fill="#A9976B"/>
