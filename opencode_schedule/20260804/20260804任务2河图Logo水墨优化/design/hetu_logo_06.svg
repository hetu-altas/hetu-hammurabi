<?xml version="1.0" encoding="UTF-8"?>
<!-- hetu_logo_06.svg 水墨候选1：五色墨阶纯墨系（笔锋最重）——立轴挂轴 + 墨分五色晕染 + 书法运笔 K 线 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="河图">
  <defs>
    <!-- 滚筒圆柱渐变：焦→重→淡（墨感浓重，三 stop） -->
    <linearGradient id="grad-roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B3733"/>
      <stop offset="50%" stop-color="#57504A"/>
      <stop offset="100%" stop-color="#8D8578"/>
    </linearGradient>
  </defs>

  <!-- 淡赭纸画布底 -->
  <rect id="bg-paper" x="0" y="0" width="500" height="500" fill="#F3E9D6"/>

  <!-- 滚筒：天杆 / 地杆（T=22，T/W=12.2%）+ 哑金轴头 -->
  <g id="scroll-roll">
    <rect id="rod-top" x="148" y="96" width="204" height="22" rx="5" fill="url(#grad-roll)"/>
    <rect id="rod-bottom" x="148" y="382" width="204" height="22" rx="5" fill="url(#grad-roll)"/>
    <circle id="cap-tl" cx="148" cy="107" r="13.5" fill="#A9976B"/>
    <circle id="cap-tr" cx="352" cy="107" r="13.5" fill="#A9976B"/>
    <circle id="cap-bl" cx="148" cy="393" r="13.5" fill="#A9976B"/>
    <circle id="cap-br" cx="352" cy="393" r="13.5" fill="#A9976B"/>
  </g>

  <!-- 竖向画幅（W=180，02 传承坐标） -->
  <g id="scroll-body">
    <rect id="panel" x="160" y="118" width="180" height="264" fill="#F3E9D6" stroke="#3B3733" stroke-width="2.5"/>
    <!-- 墨分五色晕染底：清→淡→重→焦 四层同心墨晕（opacity 分层模拟五色墨阶） -->
    <ellipse id="stain-1" cx="250" cy="270" rx="85" ry="85" fill="#B7AFA2" opacity="0.08"/>
    <ellipse id="stain-2" cx="250" cy="270" rx="70" ry="70" fill="#8D8578" opacity="0.10"/>
    <ellipse id="stain-3" cx="250" cy="270" rx="55" ry="55" fill="#57504A" opacity="0.07"/>
    <ellipse id="stain-4" cx="250" cy="270" rx="40" ry="40" fill="#3B3733" opacity="0.05"/>
  </g>

