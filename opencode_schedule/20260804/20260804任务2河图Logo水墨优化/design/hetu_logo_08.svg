<?xml version="1.0" encoding="UTF-8"?>
<!-- hetu_logo_08.svg 水墨候选3：水纹涟漪（水月镜花，笔触最柔）——立轴挂轴 + 三道清墨波纹 + 实体底部渗墨点 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="河图">
  <defs>
    <!-- 滚筒圆柱渐变：重→淡（木色感，双 stop） -->
    <linearGradient id="grad-roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57504A"/>
      <stop offset="100%" stop-color="#8D8578"/>
    </linearGradient>
  </defs>

  <!-- 淡赭纸画布底 -->
  <rect id="bg-paper" x="0" y="0" width="500" height="500" fill="#F3E9D6"/>

  <!-- 滚筒：天杆 / 地杆（T=16，T/W=8.9%，本组最小仍达标）+ 重墨轴头（无金） -->
  <g id="scroll-roll">
    <rect id="rod-top" x="147" y="102" width="206" height="16" rx="4" fill="url(#grad-roll)"/>
    <rect id="rod-bottom" x="147" y="382" width="206" height="16" rx="4" fill="url(#grad-roll)"/>
    <circle id="cap-tl" cx="147" cy="110" r="10.5" fill="#57504A"/>
    <circle id="cap-tr" cx="353" cy="110" r="10.5" fill="#57504A"/>
    <circle id="cap-bl" cx="147" cy="390" r="10.5" fill="#57504A"/>
    <circle id="cap-br" cx="353" cy="390" r="10.5" fill="#57504A"/>
  </g>

  <!-- 竖向画幅（W=180，02 传承坐标） -->
  <g id="scroll-body">
    <rect id="panel" x="160" y="118" width="180" height="264" fill="#F3E9D6" stroke="#3B3733" stroke-width="2.5"/>
    <!-- 水纹：三道横向波浪（清墨/淡墨，下疏上密）+ 渗墨点（烛影入水扩散） -->
    <path id="motif-wave-1" d="M165,332 Q190,324 215,332 T265,332 T315,332" fill="none" stroke="#B7AFA2" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <path id="motif-wave-2" d="M165,348 Q190,340 215,348 T265,348 T315,348" fill="none" stroke="#B7AFA2" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <path id="motif-wave-3" d="M165,364 Q190,356 215,364 T265,364 T315,364" fill="none" stroke="#8D8578" stroke-width="1.0" opacity="0.4" stroke-linecap="round"/>
    <ellipse id="smudge-1" cx="268" cy="279" rx="7.5" ry="5" fill="#8D8578" opacity="0.4"/>
    <ellipse id="smudge-2" cx="292" cy="255" rx="6.5" ry="4.5" fill="#8D8578" opacity="0.4"/>
    <ellipse id="smudge-3" cx="316" cy="255" rx="6.5" ry="4.5" fill="#8D8578" opacity="0.4"/>
  </g>

  <!-- 量化要素：K 线蜡烛图（7 根、波动上行、柔渗笔触：2 段影线 1.8/0.6 + 柔化实体 8.5/6） -->
  <g id="quant-kline">
    <g id="kl-1">
      <path id="kl-1-up-1" d="M172,289 L172,281.8" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-1-up-2" d="M172,281.8 L172,277" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-1-down-1" d="M172,319 L172,326.2" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-1-down-2" d="M172,326.2 L172,331" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-1-body" d="M167.75,289 Q168.35,304 169,319 L175,319 Q175.65,304 176.25,289 Z" fill="#A96B5F"/>
    </g>
    <g id="kl-2">
