      <path id="kl-2-up-2" d="M196,261.8 L196,257" fill="none" stroke="#4E5D66" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-2-down-1" d="M196,299 L196,306.2" fill="none" stroke="#4E5D66" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-2-down-2" d="M196,306.2 L196,311" fill="none" stroke="#4E5D66" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-2-body" d="M191.75,269 Q192.35,284 193,299 L199,299 Q199.65,284 200.25,269 Z" fill="#4E5D66"/>
    </g>
    <g id="kl-3">
      <path id="kl-3-up-1" d="M220,264 L220,256.8" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-3-up-2" d="M220,256.8 L220,252" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-3-down-1" d="M220,299 L220,306.2" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-3-down-2" d="M220,306.2 L220,311" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-3-body" d="M215.75,264 Q216.35,281.5 217,299 L223,299 Q223.65,281.5 224.25,264 Z" fill="#A96B5F"/>
    </g>
    <g id="kl-4">
      <path id="kl-4-up-1" d="M244,239 L244,231.8" fill="none" stroke="#4E5D66" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-4-up-2" d="M244,231.8 L244,227" fill="none" stroke="#4E5D66" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-4-down-1" d="M244,274 L244,281.2" fill="none" stroke="#4E5D66" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-4-down-2" d="M244,281.2 L244,286" fill="none" stroke="#4E5D66" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-4-body" d="M239.75,239 Q240.35,256.5 241,274 L247,274 Q247.65,256.5 248.25,239 Z" fill="#4E5D66"/>
    </g>
    <g id="kl-5">
      <path id="kl-5-up-1" d="M268,234 L268,226.8" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-5-up-2" d="M268,226.8 L268,222" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-5-down-1" d="M268,274 L268,281.2" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-5-down-2" d="M268,281.2 L268,286" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-5-body" d="M263.75,234 Q264.35,254 265,274 L271,274 Q271.65,254 272.25,234 Z" fill="#A96B5F"/>
    </g>
    <g id="kl-6">
      <path id="kl-6-up-1" d="M292,214 L292,206.8" fill="none" stroke="#4E5D66" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-6-up-2" d="M292,206.8 L292,202" fill="none" stroke="#4E5D66" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-6-down-1" d="M292,249 L292,256.2" fill="none" stroke="#4E5D66" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-6-down-2" d="M292,256.2 L292,261" fill="none" stroke="#4E5D66" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-6-body" d="M287.75,214 Q288.35,231.5 289,249 L295,249 Q295.65,231.5 296.25,214 Z" fill="#4E5D66"/>
    </g>
    <g id="kl-7">
      <path id="kl-7-up-1" d="M316,214 L316,206.8" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-7-up-2" d="M316,206.8 L316,202" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-7-down-1" d="M316,249 L316,256.2" fill="none" stroke="#A96B5F" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-7-down-2" d="M316,256.2 L316,261" fill="none" stroke="#A96B5F" stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
      <path id="kl-7-body" d="M311.75,214 Q312.35,231.5 313,249 L319,249 Q319.65,231.5 320.25,214 Z" fill="#A96B5F"/>
    </g>
  </g>

  <!-- 周期刻度：基线 + 7 根短线（02 坐标传承，全组最弱化，融入水纹层） -->
  <g id="quant-scale">
    <line id="baseline" x1="160" y1="366" x2="340" y2="366" stroke="#8D8578" stroke-width="1.5" opacity="0.3"/>
    <g stroke="#8D8578" stroke-width="1.5" opacity="0.4">
      <line id="tick-1" x1="172" y1="352" x2="172" y2="362"/>
      <line id="tick-2" x1="196" y1="352" x2="196" y2="362"/>
      <line id="tick-3" x1="220" y1="352" x2="220" y2="362"/>
      <line id="tick-4" x1="244" y1="352" x2="244" y2="362"/>
      <line id="tick-5" x1="268" y1="352" x2="268" y2="362"/>
      <line id="tick-6" x1="292" y1="352" x2="292" y2="362"/>
      <line id="tick-7" x1="316" y1="352" x2="316" y2="362"/>
    </g>
  </g>

  <!-- 顶部绦带：挂环 + 挂绳 + 双分叉垂穗（本组最宽，置顶可见） -->
  <g id="scroll-ribbon">
    <circle id="ring" cx="250" cy="100" r="4" fill="none" stroke="#57504A" stroke-width="2.0"/>
    <path id="cord" d="M250,104 C245,115 255,121 250,128" fill="none" stroke="#57504A" stroke-width="2.5" stroke-linecap="round"/>
    <path id="tassel" d="M242,136 L258,136 L253,164 L250,156 L247,164 Z" fill="#57504A" opacity="0.9"/>
  </g>
</svg>
