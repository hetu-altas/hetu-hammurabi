<?xml version="1.0" encoding="UTF-8"?>
<!-- hetu_logo_04.svg 方案4：双轴杆（坐标柱）+ 波动折线（折线图）+ 数据节点点阵 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="河图">
  <defs>
    <!-- 折线描边渐变：玄青→墨黑 -->
    <linearGradient id="grad-trend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#264653"/>
      <stop offset="100%" stop-color="#1C1C22"/>
    </linearGradient>
  </defs>

  <!-- 宣纸米白底 -->
  <rect id="bg-paper" x="0" y="0" width="500" height="500" fill="#F6F1E5"/>

  <!-- 双轴杆：左右对称坐标柱，上端卷曲纸边 + 鎏金轴头 -->
  <g id="scroll-roll">
    <rect x="104" y="110" width="12" height="280" rx="6" fill="#1C1C22"/>
    <circle cx="110" cy="104" r="5" fill="#C0A062"/>
    <path d="M104,110 q16,-10 30,-2" fill="none" stroke="#1C1C22" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="384" y="110" width="12" height="280" rx="6" fill="#1C1C22"/>
    <circle cx="390" cy="104" r="5" fill="#C0A062"/>
    <path d="M396,110 q-16,-10 -30,-2" fill="none" stroke="#1C1C22" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 坐标刻度：左轴内侧 7 条周期刻度短线 -->
  <g id="quant-scale">
    <g stroke="#264653" stroke-width="1.5" opacity="0.4">
      <line x1="116" y1="130" x2="128" y2="130"/>
      <line x1="116" y1="170" x2="128" y2="170"/>
      <line x1="116" y1="210" x2="128" y2="210"/>
      <line x1="116" y1="250" x2="128" y2="250"/>
      <line x1="116" y1="290" x2="128" y2="290"/>
      <line x1="116" y1="330" x2="128" y2="330"/>
      <line x1="116" y1="370" x2="128" y2="370"/>
    </g>
  </g>

  <!-- 量化要素：波动折线（渐变描边，上下波动后上行） -->
  <g id="quant-line">
    <polyline points="140,330 180,268 220,292 260,224 300,252 340,186 370,205"
              fill="none" stroke="url(#grad-trend)" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 数据节点点阵：朱砂折点圆点 -->
  <g id="quant-dots">
    <circle cx="140" cy="330" r="4.5" fill="#B33A2E"/>
    <circle cx="180" cy="268" r="4.5" fill="#B33A2E"/>
    <circle cx="220" cy="292" r="4.5" fill="#B33A2E"/>
    <circle cx="260" cy="224" r="4.5" fill="#B33A2E"/>
    <circle cx="300" cy="252" r="4.5" fill="#B33A2E"/>
    <circle cx="340" cy="186" r="4.5" fill="#B33A2E"/>
    <circle cx="370" cy="205" r="4.5" fill="#B33A2E"/>
  </g>
</svg>
